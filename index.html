
<!DOCTYPE html>
<html lang="fil">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liham Korespondensiya sa Filipino 9 Output)</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f3eee5;
            color: #33291f;
            font-family: Georgia, "Times New Roman", serif;
        }

        header {
            text-align: center;
            padding: 45px 20px 30px;
        }

        header p {
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #8b7355;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(30px, 5vw, 58px);
            font-weight: normal;
            line-height: 1.2;
            max-width: 1000px;
            margin: auto;
        }

        .subtitle {
            margin-top: 18px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #766b5d;
            letter-spacing: 1px;
        }

        .divider {
            width: 70px;
            height: 2px;
            background-color: #9b7953;
            margin: 30px auto;
        }

        main {
            width: 100%;
            padding: 0 5% 60px;
        }

        .photo-container {
            width: 100%;
            max-width: 1450px;
            margin: auto;
            background-color: #e5ddd0;
            padding: 15px;
            box-shadow: 0 15px 45px rgba(49, 36, 22, 0.15);
        }

        .letter-photo {
            display: block;
            width: 100%;
            height: auto;
            max-height: 1100px;
            object-fit: contain;
        }

        .caption {
            text-align: center;
            padding: 25px 15px 10px;
            font-style: italic;
            font-size: 17px;
            color: #77634b;
        }

        footer {
            text-align: center;
            padding: 25px 20px 40px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            color: #8b7355;
        }

        @media (max-width: 600px) {
            header {
                padding-top: 35px;
            }

            main {
                padding: 0 12px 35px;
            }

            .photo-container {
                padding: 6px;
            }

            .caption {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <header>
        <p>Filipino 9 • Akademikong Output</p>

        <h1>Liham Korespondensiya sa Filipino 9 Output)</h1>

        <div class="divider"></div>

        <div class="subtitle">
            Isang koleksiyon ng aking gawaing pang-akademiko
        </div>
    </header>

    <main>
        <div class="photo-container">
            <img
                src="liham-korespondensiya.jpg"
                alt="Liham Korespondensiya sa Filipino 9"
                class="letter-photo"
            >
        </div>

        <div class="caption">
            “Ang bawat liham ay nagdadala ng mensaheng mula sa puso.”
        </div>
    </main>

    <footer>
        FILIPINO 9 • LIHAM KORESPONDENSIYA
    </footer>

</body>
</html>
